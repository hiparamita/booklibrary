spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:booklibrary;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# Development-only fallback. Set JWT_SECRET to a private Base64-encoded key in deployed environments.
app.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
app.jwt.expiration=${JWT_EXPIRATION:PT1H}
